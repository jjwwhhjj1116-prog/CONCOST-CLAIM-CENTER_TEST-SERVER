<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>클레임센터 스튜디오 | CLAIM CENTER STUDIO</title>
    <link rel="icon" type="image/png" href="/assets/claim-center-emblem.png" />
    <link rel="apple-touch-icon" href="/assets/claim-center-emblem.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; font-family: 'Noto Sans KR', Manrope, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f4f7fb; color: #17202e; }
      button, input, select, textarea { font: inherit; }
      *:focus-visible { outline: 2px solid #4a86c5; outline-offset: 2px; }
      .app-shell { min-height: 100vh; background: hsl(222,47%,11%); }
      .topbar { position: sticky; top: 0; z-index: 50; min-height: 68px; padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: hsla(217,33%,17%,.96); backdrop-filter: blur(12px); border-bottom: 1px solid hsla(215,20%,65%,.22); }
      .brand-group, .session-tools, .action-row, .route-heading, .drawer-header { display: flex; align-items: center; gap: 12px; }
      .brand-group h1 { margin: 0; font-size: clamp(1rem, 2vw, 1.14rem); }
      .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; overflow: hidden; border-radius: 12px; background: #fff; box-shadow: 0 8px 22px hsla(217,91%,50%,.24); }
      .brand-mark img { width: 88%; height: 88%; display: block; object-fit: contain; }
      .brand-copy { display: grid; gap: 1px; }
      .brand-copy small { color: hsl(199,89%,65%); font-size: .62rem; font-weight: 800; letter-spacing: .14em; }
      .session-tools { min-width: 0; justify-content: flex-end; }
      .session-avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: hsl(215,25%,27%); color: hsl(199,89%,65%); font-weight: 800; }
      .session-identity { display: grid; line-height: 1.2; }
      .session-identity small { color: hsl(215,20%,68%); font-size: .7rem; }
      .shell-body { display: flex; min-height: calc(100vh - 64px); }
      .sidebar { position: sticky; top: 68px; width: 248px; height: calc(100vh - 68px); flex: 0 0 248px; padding: 18px 14px 28px; overflow: auto; background: hsl(217,33%,17%); border-right: 1px solid hsla(215,20%,65%,.22); }
      .navigation-list { display: grid; gap: 18px; }
      .navigation-group { display: grid; gap: 5px; }
      .navigation-group h2 { margin: 0 9px 4px; color: hsl(215,20%,75%); font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .navigation-link { min-height: 40px; padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-radius: 8px; color: hsl(215,20%,75%); text-decoration: none; }
      .navigation-link[aria-current="page"] { background: linear-gradient(100deg, hsl(217,91%,60%), hsl(199,89%,48%)); color: white; box-shadow: 0 8px 22px hsla(217,91%,45%,.22); }
      .navigation-link:hover { background: hsl(215,25%,27%); }
      .navigation-link small { flex: 0 0 auto; }
      .text-ellipsis { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .main-content { min-width: 0; flex: 1; overflow: auto; }
      .route-view, .route-message { padding: clamp(16px, 3vw, 32px); }
      .route-message { max-width: 720px; margin: 40px auto; text-align: center; }
      .route-heading { justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 20px; }
      .route-heading h2 { margin: 0; }
      .route-heading small, .muted { color: hsl(215,20%,70%); }
      .state-controls { display: flex; gap: 8px; flex-wrap: wrap; }
      .content-stack, .form-stack { display: grid; gap: 16px; }
      .form-stack { max-width: 680px; }
      .inline-form { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
      .inline-form > div { flex: 1 1 200px; }
      .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
      .kpi-value { display: block; font-size: clamp(1.8rem, 5vw, 2.8rem); }
      .error-box { padding: 12px; border: 1px solid hsl(346,87%,60%); border-radius: 8px; background: hsla(346,87%,30%,.25); }
      .empty-box { padding: 28px; text-align: center; border: 1px dashed hsla(215,20%,65%,.5); border-radius: 8px; }
      .table-title { display: block; max-width: 320px; }
      .content-stack ul { margin: 8px 0 16px; padding-left: 22px; }
      .content-stack li { margin: 6px 0; }
      .action-row { flex-wrap: wrap; }
      .report-editor { width: 100%; min-height: 160px; margin: 8px 0 16px; padding: 12px; color: inherit; background: hsl(222,47%,11%); border: 1px solid hsla(215,20%,65%,.4); border-radius: 8px; resize: vertical; }
      .report-editor[readonly] { cursor: not-allowed; opacity: .75; }
      .modal-backdrop { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 20px; background: rgba(15,23,42,.62); backdrop-filter: blur(3px); }
      .drawer-panel { width: min(340px, 88vw); height: 100%; display: flex; flex-direction: column; gap: 16px; box-shadow: 12px 0 32px rgba(0,0,0,.4); }
      .drawer-header { justify-content: space-between; }
      .drawer-header h2 { margin: 0; font-size: 1.1rem; }
      .drawer-content { min-height: 0; flex: 1; overflow: auto; }
      .icon-button { min-width: 44px; min-height: 44px; border: 0; border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
      .dialog-panel { box-sizing: border-box; width: min(520px, calc(100vw - 40px)); max-height: calc(100dvh - 40px); margin: auto; overflow: auto; padding: 24px; border: 1px solid hsla(215,20%,65%,.35); border-radius: 16px; background: hsl(217,33%,17%); box-shadow: 0 20px 60px rgba(0,0,0,.38); }
      .dialog-panel--wide { width: min(900px, calc(100vw - 40px)); }
      .dialog-panel > h2 { margin: 0 0 20px; }
      @media (max-width: 720px) {
        .modal-backdrop { align-items: flex-start; padding: 10px; }
        .dialog-panel, .dialog-panel--wide { width: calc(100vw - 20px); max-height: calc(100dvh - 20px); padding: 18px; border-radius: 14px; }
        .dialog-panel > h2 { margin-bottom: 14px; font-size: 1.1rem; line-height: 1.35; }
      }
      .dialog-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
      .login-page { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      .login-page > * { width: min(480px, 100%); }
      .p08-catalog { display: grid; gap: 18px; min-width: 0; }
      .p08-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .p08-toolbar h3, .p08-toolbar h4, .p08-catalog h5 { margin: 0 0 6px; }
      .p08-toolbar p { margin: 0; }
      .p08-type-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; }
      .p08-type-tab, .p08-template-option { min-height: 48px; padding: 12px; border: 1px solid hsla(215,20%,65%,.35); border-radius: 9px; background: hsl(217,33%,17%); color: inherit; cursor: pointer; text-align: left; }
      .p08-type-tab { display: grid; gap: 4px; }
      .p08-type-tab span, .p08-type-tab small { color: hsl(215,20%,75%); }
      .p08-type-tab.is-selected, .p08-template-option.is-selected { border-color: hsl(217,91%,60%); box-shadow: inset 0 0 0 2px hsl(217,91%,60%); background: hsl(215,28%,23%); }
      .p08-layout { display: grid; grid-template-columns: minmax(220px, .75fr) minmax(0, 2fr); gap: 16px; min-width: 0; }
      .p08-template-list, .p08-template-detail, .p08-admin-panel, .p08-reference-panel, .p08-instance-panel, .p08-empty-state, .p08-skeleton { min-width: 0; padding: 16px; border: 1px solid hsla(215,20%,65%,.3); border-radius: 10px; background: hsl(217,33%,17%); }
      .p08-template-list { display: grid; align-content: start; gap: 8px; }
      .p08-template-option { display: grid; gap: 5px; width: 100%; overflow-wrap: anywhere; }
      .p08-template-detail { display: grid; gap: 18px; }
      .p08-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0; }
      .p08-facts div { min-width: 0; padding: 10px; border-radius: 8px; background: hsl(222,47%,11%); }
      .p08-facts dt { color: hsl(215,20%,70%); font-size: .83rem; }
      .p08-facts dd { margin: 5px 0 0; overflow-wrap: anywhere; }
      .p08-toc, .p08-reference-list { padding-left: 22px; }
      .p08-toc li, .p08-reference-list li { margin: 8px 0; overflow-wrap: anywhere; }
      .p08-alert { padding: 12px 14px; border-radius: 8px; overflow-wrap: anywhere; }
      .p08-alert--error { border: 1px solid hsl(346,87%,60%); background: hsla(346,87%,30%,.25); }
      .p08-alert--success { border: 1px solid hsl(142,71%,45%); background: hsla(142,71%,25%,.25); }
      .p08-badge { display: inline-flex; max-width: 100%; padding: 3px 8px; border: 1px solid hsla(215,20%,65%,.45); border-radius: 999px; font-size: .78rem; overflow-wrap: anywhere; }
      .p08-badge--active, .p08-badge--human-approved { border-color: hsl(142,71%,45%); color: hsl(142,70%,70%); }
      .p08-badge--review-required, .p08-badge--draft { border-color: hsl(38,92%,50%); color: hsl(38,92%,70%); }
      .p08-reference-grid, .p08-block-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
      .p08-reference-grid > *, .p08-block-grid > * { min-width: 0; overflow-wrap: anywhere; }
      .p08-admin-panel summary, .p08-reference-panel summary { min-height: 44px; padding: 10px 0; cursor: pointer; font-weight: 700; }
      .p08-empty-state { text-align: center; overflow-wrap: anywhere; }
      .p08-skeleton { position: relative; overflow: hidden; }
      .p08-skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, hsla(0,0%,100%,.08), transparent); animation: p08-shimmer 1.2s infinite; }
      @keyframes p08-shimmer { to { transform: translateX(100%); } }
      .workspace-eyebrow { color: hsl(199,89%,64%); font-size: .7rem; font-weight: 850; letter-spacing: .14em; }
      .dashboard-page, .report-list-page, .approval-inbox-page { display: grid; gap: 18px; }
      .dashboard-hero, .workspace-hero { min-width: 0; padding: clamp(20px, 3vw, 30px); display: flex; align-items: center; justify-content: space-between; gap: 24px; border: 1px solid hsla(199,89%,60%,.25); border-radius: 16px; background: radial-gradient(circle at 80% 10%, hsla(199,89%,55%,.18), transparent 40%), linear-gradient(135deg, hsl(217,33%,19%), hsl(222,47%,13%)); overflow: hidden; }
      .dashboard-hero h3, .workspace-hero h3 { margin: 7px 0 5px; font-size: clamp(1.35rem, 3vw, 2rem); }
      .dashboard-hero p, .workspace-hero p { max-width: 720px; margin: 0; color: hsl(215,20%,72%); line-height: 1.6; }
      .dashboard-quick-actions { display: flex; gap: 9px; flex-wrap: wrap; flex: 0 0 auto; }
      .dashboard-kpi-grid, .report-summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .dashboard-kpi, .report-summary-grid > div { position: relative; min-width: 0; padding: 18px; border: 1px solid hsla(215,20%,65%,.24); border-radius: 13px; background: hsl(217,33%,17%); overflow: hidden; }
      .dashboard-kpi::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: hsl(199,89%,55%); }
      .dashboard-kpi--red::before { background: hsl(346,87%,60%); }
      .dashboard-kpi--amber::before { background: hsl(38,92%,55%); }
      .dashboard-kpi--cyan::before { background: hsl(180,75%,46%); }
      .dashboard-kpi > span, .report-summary-grid span { color: hsl(215,20%,72%); font-size: .82rem; }
      .dashboard-kpi strong, .report-summary-grid strong { display: block; margin: 6px 0 3px; font-size: clamp(1.8rem, 4vw, 2.55rem); }
      .dashboard-kpi small { color: hsl(215,20%,60%); }
      .dashboard-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .dashboard-work-list { list-style: none; margin: 0 !important; padding: 0 !important; }
      .dashboard-work-list li { margin: 0 !important; border-bottom: 1px solid hsla(215,20%,65%,.16); }
      .dashboard-work-list li:last-child { border-bottom: 0; }
      .dashboard-work-list button { width: 100%; padding: 12px 2px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; }
      .dashboard-work-list button:hover strong { color: hsl(199,89%,65%); }
      .dashboard-work-list button > span:first-child { min-width: 0; display: grid; gap: 4px; }
      .dashboard-work-list strong, .dashboard-work-list small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dashboard-work-list small { color: hsl(215,20%,66%); }
      .dashboard-status, .report-state-badge { flex: 0 0 auto; padding: 4px 8px; border-radius: 999px; background: hsla(199,89%,55%,.12); color: hsl(199,89%,68%); font-size: .74rem; font-weight: 750; }
      .report-summary-grid > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .report-summary-grid strong { margin: 0; font-size: 1.8rem; }
      .report-workspace-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 14px; }
      .report-workspace-card { min-width: 0; padding: 18px; display: grid; gap: 15px; border: 1px solid hsla(215,20%,65%,.25); border-radius: 14px; background: hsl(217,33%,17%); transition: transform .16s ease, border-color .16s ease; }
      .report-workspace-card:hover { transform: translateY(-2px); border-color: hsla(199,89%,60%,.55); }
      .report-workspace-card header, .report-workspace-card footer, .report-progress-label { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .report-workspace-card header > div { min-width: 0; }
      .report-workspace-card h4 { margin: 5px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.06rem; }
      .report-workspace-card p, .report-template-line { margin: 0; color: hsl(215,20%,68%); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .report-case-number { color: hsl(199,89%,65%); font-size: .73rem; font-weight: 750; }
      .report-state-badge.is-ready { background: hsla(38,92%,50%,.14); color: hsl(38,92%,70%); }
      .report-state-badge.is-final { background: hsla(142,71%,45%,.14); color: hsl(142,70%,70%); }
      .report-progress-label { color: hsl(215,20%,72%); font-size: .8rem; }
      .report-progress { height: 7px; overflow: hidden; border-radius: 999px; background: hsl(222,47%,11%); }
      .report-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, hsl(217,91%,60%), hsl(180,75%,46%)); }
      .report-workspace-card footer { align-items: center; }
      .report-file-badges { display: flex; gap: 5px; flex-wrap: wrap; }
      .report-file-badges span { padding: 3px 7px; border-radius: 5px; background: hsl(222,47%,11%); color: hsl(215,20%,68%); font-size: .7rem; }
      .report-empty-state, .report-list-loading { padding: 42px 24px; text-align: center; border: 1px dashed hsla(215,20%,65%,.4); border-radius: 14px; }
      .report-empty-state p { color: hsl(215,20%,68%); }
      .approval-filter { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(160px, .45fr) auto auto; align-items: end; gap: 12px; }
      .approval-filter label { display: grid; gap: 6px; color: hsl(215,20%,76%); font-size: .84rem; }
      .approval-filter select { min-height: 42px; padding: 8px 10px; border: 1px solid hsla(215,20%,65%,.42); border-radius: 8px; background: hsl(222,47%,11%); color: inherit; }
      .approval-result-heading { display: flex; align-items: center; justify-content: space-between; color: hsl(215,20%,72%); }
      .approval-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(390px, 100%), 1fr)); gap: 14px; }
      .approval-card { min-width: 0; padding: 18px; display: grid; gap: 14px; border: 1px solid hsla(215,20%,65%,.25); border-radius: 14px; background: hsl(217,33%,17%); }
      .approval-card header, .approval-card footer { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .approval-card header > div { min-width: 0; }
      .approval-card header span { color: hsl(199,89%,65%); font-size: .73rem; font-weight: 750; }
      .approval-card h4 { margin: 6px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .approval-card p { margin: 0; color: hsl(215,20%,68%); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .approval-card dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .approval-card dl > div { min-width: 0; padding: 9px; border-radius: 8px; background: hsl(222,47%,11%); }
      .approval-card dt { color: hsl(215,20%,60%); font-size: .72rem; }
      .approval-card dd { margin: 4px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .84rem; }
      .approval-card blockquote { margin: 0; padding: 10px 12px; border-left: 3px solid hsl(199,89%,55%); background: hsla(199,89%,45%,.08); color: hsl(215,20%,78%); }
      .approval-card footer { align-items: center; color: hsl(215,20%,64%); font-size: .76rem; }
      .approval-status { flex: 0 0 auto; padding: 5px 8px; border-radius: 999px; background: hsla(199,89%,55%,.13); color: hsl(199,89%,70%); font-size: .74rem; }
      .approval-status--changes_requested { background: hsla(346,87%,50%,.13); color: hsl(346,87%,72%); }
      .approval-status--approved { background: hsla(142,71%,45%,.14); color: hsl(142,70%,70%); }
      .approval-status--resubmitted { background: hsla(38,92%,50%,.14); color: hsl(38,92%,72%); }
      @media (max-width: 1024px) {
        .topbar { padding-inline: 16px; }
        .session-tools { flex: 1 1 auto; }
        .p08-layout { grid-template-columns: 1fr; }
        .p08-template-list { grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); }
        .dashboard-kpi-grid, .report-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .dashboard-columns { gap: 12px; }
      }
      @media (max-width: 760px) {
        .topbar { align-items: stretch; gap: 8px; padding: 8px 12px; }
        .brand-group { width: 100%; justify-content: flex-start; }
        .brand-mark { width: 38px; height: 38px; }
        .session-tools { width: 100%; max-width: 100%; justify-content: flex-start; gap: 7px; overflow-x: auto; padding-bottom: 3px; flex-wrap: nowrap; scrollbar-width: thin; }
        .session-tools > * { flex: 0 0 auto; }
        .preview-chip, .session-identity { display: none; }
        .shell-body { min-height: calc(100dvh - 106px); }
        .dashboard-page { gap: 12px; }
        .dashboard-hero, .workspace-hero { align-items: stretch; flex-direction: column; gap: 16px; padding: 20px 18px; border-radius: 13px; }
        .dashboard-hero h3, .workspace-hero h3 { font-size: clamp(1.35rem, 7vw, 1.75rem); line-height: 1.25; }
        .dashboard-quick-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
        .dashboard-quick-actions > :first-child { grid-column: 1 / -1; }
        .dashboard-quick-actions button { width: 100%; min-height: 44px; }
        .dashboard-columns { grid-template-columns: 1fr; }
        .dashboard-work-list button { align-items: flex-start; padding: 14px 2px; }
        .dashboard-work-list strong, .dashboard-work-list small { white-space: normal; overflow-wrap: anywhere; }
        .dashboard-status { margin-top: 1px; }
        .approval-filter { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        .route-view, .route-message { padding: 12px; }
        .state-controls > button { flex: 1 1 30%; }
        .brand-copy h1 { font-size: .98rem; white-space: nowrap; }
        .brand-copy small { display: none; }
        .dashboard-kpi-grid, .report-summary-grid { grid-template-columns: 1fr; gap: 9px; }
        .dashboard-kpi, .report-summary-grid > div { padding: 15px 16px; }
        .dashboard-kpi strong, .report-summary-grid strong { font-size: 1.75rem; }
        .dashboard-quick-actions { grid-template-columns: 1fr; }
        .dashboard-quick-actions > :first-child { grid-column: auto; }
        .dashboard-work-list button { flex-direction: column; }
        .dashboard-status { align-self: flex-start; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
